[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

dynamic = ["version"]

[project]
name = "ml-tools"
dynamic = ["version"]
authors = [
    {name = "David Graey", email = "graeyband@gmail.com"},
    {name = "Dr Charles Anderson", email = "Chuck.Anderson@colostate.edu"}
]
dependencies = [
    "matplotlib",
    "numpy",
    "scipy"
]

description = "tools for ML, supervised and unsupervised tasks"
readme = "README.md"
requires-python = ">=3.10"


[project.optional-dependencies]
gui=["matplotlib.pyplot"]
audio=["librosa", "wave"]
test=["pytest"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout, so tests import ml_tools without an editable install
pythonpath = ["src", "tests"]
addopts = "--strict-markers"
markers = [
    "slow: finite-difference gradient checks, run with -m 'not slow' to skip",
]


[project.urls]
"Homepage" = "https://github.com/pypa/sampleproject"
"Repository" = "https://github.com/me/spam.git"
"Changelog" = "https://github.com/me/spam/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"